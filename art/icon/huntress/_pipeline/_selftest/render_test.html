<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>render.sh selftest — Edge 无头渲染测试稿</title>
<style>
  html, body { margin: 0; padding: 0; width: 1024px; height: 1024px; overflow: hidden; }
  body {
    position: relative;
    background: radial-gradient(circle at 50% 42%, #8e1a24 0%, #4a0d14 38%, #140407 72%, #080203 100%);
  }
  /* 三角外发光 */
  .glow {
    position: absolute; left: 218px; top: 172px; width: 588px; height: 604px;
    background: #ff4a3c;
    clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
    filter: blur(58px);
    opacity: .55;
  }
  /* 米白→珊瑚的三角楔 */
  .tri {
    position: absolute; left: 232px; top: 196px; width: 560px; height: 576px;
    background: linear-gradient(178deg, #fff0d6 0%, #ffd7bd 42%, #ff8f80 100%);
    clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
  }
  /* 三角内的一条暗红刻线 */
  .score {
    position: absolute; left: 500px; top: 318px; width: 7px; height: 348px;
    background: linear-gradient(180deg, rgba(190,40,55,.85), rgba(190,40,55,.35));
    transform: rotate(14deg); transform-origin: top center;
    border-radius: 4px;
  }
  /* 底部一圈很淡的环，让画面有层次 */
  .ring {
    position: absolute; left: 262px; top: 712px; width: 500px; height: 250px;
    border: 3px solid rgba(255, 214, 200, .18);
    border-radius: 50%;
    border-top-color: transparent;
  }
  .caption {
    position: absolute; left: 0; bottom: 78px; width: 1024px; text-align: center;
    font-family: -apple-system, "SF Pro Display", "PingFang SC", sans-serif;
    color: rgba(255, 244, 240, .88); font-size: 34px; font-weight: 600;
    letter-spacing: 10px;
  }
  .sub {
    position: absolute; left: 0; bottom: 44px; width: 1024px; text-align: center;
    font-family: -apple-system, "SF Pro Display", "PingFang SC", sans-serif;
    color: rgba(255, 244, 240, .36); font-size: 19px; letter-spacing: 4px;
  }
</style>
</head>
<body>
  <div class="ring"></div>
  <div class="glow"></div>
  <div class="tri"></div>
  <div class="score"></div>
  <div class="caption">红楔 · RENDER TEST</div>
  <div class="sub">EDGE HEADLESS · 1024 × 1024</div>
</body>
</html>
