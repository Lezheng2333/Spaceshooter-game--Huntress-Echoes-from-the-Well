<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'AvenirX';src:url('file:///System/Library/Fonts/Avenir Next Condensed.ttc');}

html,body{margin:0;padding:0;width:2000px;height:900px;overflow:hidden;background:#02050A;}

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 900">
<defs>

</g>

<text x="124" y="358" font-family="AvenirX" font-weight="900" font-size="190" textLength="960" lengthAdjust="spacingAndGlyphs" fill="#C8322B" opacity=".18">HUNTRESS</text>
<text x="120" y="354" font-family="AvenirX" font-weight="900" font-size="190" textLength="960" lengthAdjust="spacingAndGlyphs" fill="url(#cream)" filter="url(#soft)">HUNTRESS</text>
<text x="124" y="426" font-family="DINX" font-size="42" letter-spacing="12" fill="#E9E2D0" opacity=".9">ECHOES FROM THE WELL</text>

<g transform="translate(1540,450)">

 <circle r="330" fill="none" stroke="#E9E2D0" stroke-width="2.5" opacity=".7"/>
 <circle r="318" fill="none" stroke="#E9E2D0" stroke-width="1" opacity=".2"/>

 <g transform="translate(0,-160) rotate(-90) scale(6.4)"><use href="#mark"/></g>
</g>
<rect width="2000" height="900" fill="url(#scan)"/>
<rect width="2000" height="900" fill="url(#vig)"/>

</body></html>
